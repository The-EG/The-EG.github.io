{% extends "base.html" %}

{% block title %}{{ SITENAME|striptags }} - Tags{% endblock %}

{% block content %}
    <h2>Tags for {{ SITENAME }}</h2>
    <div class="d-flex flex-wrap">
    {% for tag, articles in tags|sort %}
        <div class="mb-1 me-1">
            <a 
                class="btn btn-outline-secondary"
                href="{{ SITEURL }}/{{ tag.url }}">
                {{ tag }} ({{ articles|count }})
            </a>
        </div>
    {% endfor %}
    </div>
{% endblock %}
